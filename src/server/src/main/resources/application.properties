spring.application.name=backend
server.port=${PORT:8080}

# Firebase service account key (Firebase console > Project settings > Service accounts).
# Leave blank to fall back to the GOOGLE_APPLICATION_CREDENTIALS environment variable.
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# Comma-separated origins allowed to call /api (the Vite dev server by default).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
